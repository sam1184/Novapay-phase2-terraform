name: NovaPay Contract & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'newawsaccount/DevOps-agent/**'
  pull_request:
    paths:
      - 'newawsaccount/DevOps-agent/**'

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: novapay-devops-agent-lab
  NAMESPACE: novapay-prod

jobs:
  # ── Job 1: Contract tests (runs on every PR and push) ──────────────────────
  contract-test:
    name: Contract Test (token format compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Run contract tests
        working-directory: newawsaccount/DevOps-agent
        run: |
          chmod +x ci/contract-test.sh
          bash ci/contract-test.sh

  # ── Job 2: Pre-deployment compatibility check (push to main only) ───────────
  pre-deploy-check:
    name: Pre-Deploy Version Compatibility
    runs-on: ubuntu-latest
    needs: contract-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Run pre-deployment check
        working-directory: newawsaccount/DevOps-agent
        env:
          # Override these in the workflow dispatch or via repo vars when
          # intentionally changing token formats:
          DEPLOY_SERVICE:    ${{ vars.DEPLOY_SERVICE }}
          NEW_TOKEN_FORMAT:  ${{ vars.NEW_TOKEN_FORMAT }}
          NAMESPACE:         ${{ env.NAMESPACE }}
        run: |
          chmod +x ci/pre-deploy-check.sh
          bash ci/pre-deploy-check.sh

  # ── Job 3: Apply Kubernetes manifests (push to main only) ───────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: pre-deploy-check
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Install Argo Rollouts kubectl plugin
        run: |
          curl -sLO https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64
          chmod +x kubectl-argo-rollouts-linux-amd64
          sudo mv kubectl-argo-rollouts-linux-amd64 /usr/local/bin/kubectl-argo-rollouts

      - name: Apply RBAC + PreSync hook
        run: kubectl apply -f newawsaccount/DevOps-agent/k8s/argocd-presync-job.yaml

      - name: Apply payment-service Rollout + AnalysisTemplate
        run: kubectl apply -f newawsaccount/DevOps-agent/k8s/payment-service-rollout.yaml

      - name: Wait for rollout to complete
        run: |
          kubectl argo-rollouts status payment-service \
            -n ${{ env.NAMESPACE }} --timeout 300s
